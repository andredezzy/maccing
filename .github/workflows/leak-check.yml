# Runs scripts/leak-check.ts as a gate, on every push and every pull request.
#
# The dictionary is not in this repository. Terms and exemptions live in a private overlay, and
# without one the checker matches nothing, prints PASSED and exits 0 — which is why every step
# below passes `--require-overlay`. Supply the overlay either way round:
#
#   * as the `LEAK_OVERLAY` secret, whose value is the whole contents of the overlay JSON, or
#   * by checking the private repository out into a path outside the workspace and pointing
#     `--terms` at the file, if the overlay is large enough that a secret is unwieldy.
#
# It must land outside `$GITHUB_WORKSPACE`: a dictionary's own terms are suppressed inside it, so
# an overlay written into the tree being scanned would be the one file its vocabulary could never
# be reported in, and the checker refuses that run outright.
#
# A missing overlay fails the job. It is never skipped and never downgraded to a warning: a pull
# request from a fork gets no secrets, so it gets no clearance either, and the honest way to say
# so is a red job rather than a green one that checked nothing.

name: leak-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit scan is a post-rewrite clearance, and a pass on a shallow clone would read
          # as "the history is clean" while covering only the slice that was fetched.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Write the overlay dictionary outside the workspace
        env:
          LEAK_OVERLAY: ${{ secrets.LEAK_OVERLAY }}
        run: |
          set -eu
          if [ -z "${LEAK_OVERLAY:-}" ]; then
            echo "::error::No overlay dictionary. The LEAK_OVERLAY secret is unset, so this run" \
                 "would check no name, no figure and no domain word and still pass. Set the secret" \
                 "to the contents of the private overlay JSON, or check the private repository out" \
                 "to a path outside the workspace and point --terms at it. Forks get no secrets and" \
                 "so cannot be cleared here."
            exit 1
          fi
          printf '%s' "$LEAK_OVERLAY" > "$RUNNER_TEMP/leak-terms.json"

      # Proves the checker itself before trusting its verdict. It plants its own invented fixtures
      # and needs no dictionary, so it deliberately does not ask for the overlay.
      - name: Self-test
        run: bun scripts/leak-check.ts --self-test

      - name: Audit the exemptions
        run: bun scripts/leak-check.ts --terms "$RUNNER_TEMP/leak-terms.json" --require-overlay --audit

      - name: Scan every tracked file and the whole history
        run: bun scripts/leak-check.ts --terms "$RUNNER_TEMP/leak-terms.json" --require-overlay --commits
