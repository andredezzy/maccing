# Runs .github/scripts/leak-check.ts as a gate, on every push and every pull request.
#
# The dictionary is not in this repository — not the terms, not the exemptions, and not a schema
# describing either. `LEAK_OVERLAY` is the only way this job gets a vocabulary: its value is the
# whole overlay JSON, written by the first step to `$RUNNER_TEMP/leak-terms.json`. Nothing under
# version control here names a term, a category or a client, so a reader of this repository learns
# the mechanism and nothing about the work it protects.
#
# Without an overlay the checker matches nothing, prints PASSED and exits 0 — which is why every
# step below passes `--require-overlay`.
#
# **Checking the private repository out and pointing `--terms` at it is not an equivalent option
# here, and used to be offered as one.** The private repository's own name is a term the dictionary
# declares, so that path *is* vocabulary, and this repository is public: its Actions logs are
# world-readable. Two things publish the name before the gate has an opinion about it — Actions
# echoes each step's `run:` line into the log verbatim, and `actions/checkout` names the repository
# it clones. No flag on the checker reaches either of them. The checker itself no longer prints an
# overlay's path at all; it says which of the `--terms` arguments each dictionary was, so the
# residue is this file's own logging and not the gate's. Use the checkout form only where the log
# is private — a private repository, or a self-hosted runner whose logs are not published.
#
# Wherever the overlay lands, it must land outside `$GITHUB_WORKSPACE`: a dictionary's own terms
# are suppressed inside it, so an overlay written into the tree being scanned would be the one file
# its vocabulary could never be reported in, and the checker refuses that run outright. That
# refusal resolves both paths the same way before comparing them, so a symlinked spelling of one
# directory — `/tmp` against `/private/tmp`, `$RUNNER_TEMP` against wherever the runner really put
# it — no longer reads as "outside the repository" and no longer lets the run through.
#
# A missing overlay fails the job. It is never skipped and never downgraded to a warning: a pull
# request from a fork gets no secrets, so it gets no clearance either, and the honest way to say
# so is a red job rather than a green one that checked nothing.
#
# The only thing this file can check about the secret is that it is not empty, which a secret
# rotated to `{}` passes. `--require-overlay` is what closes that: it fails a run that loaded no
# terms, not merely a run that merged no file, so an overlay that is empty, malformed or truncated
# is a red job rather than a `0 terms` header nobody reads.

name: leak

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--history` reads every blob reachable from every ref. A pass on a shallow clone would
          # read as "the history is clean" while covering only the slice that was fetched, so the
          # whole object graph has to be here.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Write the overlay dictionary outside the workspace
        env:
          LEAK_OVERLAY: ${{ secrets.LEAK_OVERLAY }}
        run: |
          set -eu
          if [ -z "${LEAK_OVERLAY:-}" ]; then
            echo "::error::No overlay dictionary. The LEAK_OVERLAY secret is unset, so this run" \
                 "would check no name, no figure and no domain word and still pass. Set the secret" \
                 "to the contents of the private overlay JSON. Do not substitute a checkout of the" \
                 "private repository here: its name is a term the dictionary declares, and this" \
                 "repository's logs are public. Forks get no secrets and so cannot be cleared here."
            exit 1
          fi
          printf '%s' "$LEAK_OVERLAY" > "$RUNNER_TEMP/leak-terms.json"

      # Proves the checker itself before trusting its verdict. It plants its own invented fixtures
      # and needs no dictionary, but it also plants every term of every loaded category — so the
      # overlay makes it a stronger test, and --require-overlay here is what turns a secret rotated
      # to `{}` into a red job at the first step rather than a green one at the last.
      - name: Self-test
        run: bun .github/scripts/leak-check.ts --terms "$RUNNER_TEMP/leak-terms.json" --require-overlay --self-test

      # `--quiet` on both scanning steps, and it is not about noise. On a hit the gate prints the
      # matched term, its category and the overlay's own justification prose for that term — which
      # is the private dictionary's content, verbatim. This repository is public, so its Actions
      # logs are world-readable, and a red run would publish the vocabulary the overlay exists to
      # keep out of it. Secret masking does not help: it matches the literal secret value, while
      # the gate prints the terms reformatted one per line. Quiet keeps the verdict, the counts and
      # the exit code, and drops every line that carries a term, a category name or a reason. Read
      # the detail locally, where the overlay already lives.
      #
      # Quiet governs the report, and the report is not the only thing that reaches this log. A run
      # that cannot load the overlay never reaches a report to silence: it prints to stderr and
      # exits 2, and no flag has ever reached stderr — nor should one, because a broken overlay has
      # to be said out loud. What makes those messages safe here is not a guard but their shape:
      # each names the fault by coordinate — which file, which category index, which term index, or
      # which line and column — and never the text at it, and the engine's own parse error, which
      # quotes the token it choked on, is never forwarded. `leak-check.ts` carries the full list of
      # print sites and the guard on each; keep it in step with any new output.
      - name: Audit the exemptions
        run: bun .github/scripts/leak-check.ts --terms "$RUNNER_TEMP/leak-terms.json" --require-overlay --audit --quiet

      - name: Scan every tracked file and clear the whole history
        run: bun .github/scripts/leak-check.ts --terms "$RUNNER_TEMP/leak-terms.json" --require-overlay --history --quiet
